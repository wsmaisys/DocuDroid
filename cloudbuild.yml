# cloudbuild.yaml

# 1. Build the Docker image
steps:
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args:
  - 'build'
  - '-t'
  - 'gcr.io/$PROJECT_ID/docudroid:$COMMIT_SHA'  # Tag with the commit SHA
  - '.'

# 2. Push the Docker image to Google Container Registry (GCR)
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args:
  - 'push'
  - 'gcr.io/$PROJECT_ID/docudroid:$COMMIT_SHA'

# 3. Deploy the new image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Deploy
  args:
  - 'gcloud'
  - 'run'
  - 'deploy'
  - 'docudroid' # Replace with your Cloud Run service name
  - '--image'
  - 'gcr.io/$PROJECT_ID/docudroid:$COMMIT_SHA'
  - '--region'
  - 'us-central1' # Replace with your deployment region
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated' # Only include if you need public access
  - '--quiet'
  env:
  - 'PROJECT_ID=$PROJECT_ID'

# Store the built image in GCR/Artifact Registry
images:
- 'gcr.io/$PROJECT_ID/docudroid:$COMMIT_SHA'